# Target matrix and placeholders for a balanced Order x Period design
# Use this file as a planning template, then copy selected entries into config.yaml -> corpus.

matrix:
  design: "balanced_order_x_period"
  orders:
    - "Hymenoptera"
    - "Coleoptera"
    - "Gastropoda"
    - "Copepoda"
  period_classes:
    - "early_descriptive"
    - "transitional"
    - "modern_integrative"
  target_per_cell: 1
  total_target_descriptions: 12

# Optional expansion targets for stronger inference
expansion_options:
  min_robust_target_per_cell: 2
  preferred_target_per_cell: 3
  total_if_2_per_cell: 24
  total_if_3_per_cell: 36

# Paste entries from this section under `corpus:` in config.yaml.
# Keep `description_type` constant (recommended: original) in phase 1.
# Replace all TBD values before running the pipeline.
